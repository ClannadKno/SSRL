# nginx WebSocket reverse proxy snippet
# ====================================
# Add this inside your nginx server block.
# This proxies ws://YOUR_SERVER_IP/ws/doc-<id> to ASGI on port 8001.
# No need to expose port 8001 to the internet.
# ====================================

# Flask proxy (you already have this)
# location / {
#     proxy_pass http://127.0.0.1:8000;
#     ...
# }

# Collaboration WebSocket proxy
location /ws/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
}
