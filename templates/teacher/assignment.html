{# SSRL-ESP Teacher Condition Assignment #}

<div class="container">
  <div class="nav" style="margin-bottom:20px">
    <div class="nav-title">Condition 分配</div>
    <div class="nav-user">
      <a class="btn small secondary" href="/teacher">返回仪表盘</a>
      <a class="btn small secondary" href="/logout">退出</a>
    </div>
  </div>

  <section class="card" style="margin-bottom:16px">
    <div class="card-hd">
      <h2>分配状态</h2>
    </div>
    <div class="card-bd" id="assignmentStatus">
      <div class="evidence">加载中...</div>
    </div>
  </section>

  <div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-bottom:16px">
    <div class="card">
      <div class="card-hd"><h2>运行分配</h2></div>
      <div class="card-bd" style="display:grid;gap:12px">
        <div>
          <div class="label">Random Seed</div>
          <input id="assignmentSeed" type="number" min="0" step="1" value="42" placeholder="输入 seed">
        </div>
        <button class="btn" onclick="runAssignment()">运行分配</button>
      </div>
    </div>
    <div class="card">
      <div class="card-hd"><h2>冻结</h2></div>
      <div class="card-bd" style="display:grid;gap:12px">
        <p class="muted" style="font-size:13px;line-height:1.7">冻结后所有组的 condition 分配变为只读，不可修改。S2 干预课次开始前必须先冻结。</p>
        <button class="btn warning" onclick="freezeAssignment()">冻结 Condition</button>
      </div>
    </div>
  </div>

  <div id="assignmentActionStatus" class="muted" style="font-size:13px;margin-top:8px"></div>
</div>

<script src="/static/teacher/teacher-api.js"></script>
<script src="/static/teacher/assignment.js"></script>
<script>loadAssignmentStatus();</script>
